<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MDDW responsive preview</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #1c1917; color: #e7e5e4; }
  .bar { padding: 8px 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .bar b { color: #fbbf24; }
  .row { display: flex; gap: 14px; padding: 0 12px 12px; align-items: flex-start; }
  .frame { flex: 0 0 auto; }
  .label { padding: 4px 0; font-weight: 600; color: #a8a29e; }
  iframe { border: 2px solid #44403c; border-radius: 10px; background: #fff; display: block; }
</style>
</head>
<body>
  <div class="bar">
    <b>MDDW responsive preview</b>
    <span id="info"></span>
  </div>
  <div class="row" id="row"></div>
<script>
  const q = new URLSearchParams(location.search);
  const path = q.get('path') || '/';
  // widths=390,768,1280  scale=0.5
  const widths = (q.get('widths') || '390').split(',').map(Number);
  const h = Number(q.get('h') || 800);
  const scale = Number(q.get('scale') || 1);

  document.getElementById('info').textContent = 'path=' + path + '  widths=' + widths.join(',') + '  scale=' + scale;

  const row = document.getElementById('row');
  for (const w of widths) {
    const wrap = document.createElement('div');
    wrap.className = 'frame';
    wrap.style.width = (w * scale) + 'px';

    const lab = document.createElement('div');
    lab.className = 'label';
    lab.textContent = w + 'px' + (w < 768 ? '  (mobile)' : w < 1024 ? '  (tablet / md)' : '  (desktop)');
    wrap.appendChild(lab);

    const f = document.createElement('iframe');
    f.src = path;
    f.width = w;
    f.height = h;
    f.style.transform = 'scale(' + scale + ')';
    f.style.transformOrigin = 'top left';
    f.style.marginBottom = (h * scale - h) + 'px';
    wrap.appendChild(f);

    row.appendChild(wrap);
  }
</script>
</body>
</html>
